<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | AdVisual Studio</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif}
body{
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  color:#fff;background:#050c08;
}
.card{
  width:100%;max-width:650px;padding:42px 52px;border:1px solid #284331;
  border-radius:28px;background:#0a160f;box-shadow:0 30px 100px rgba(0,0,0,.5);
}
.logo{text-align:center;margin-bottom:28px}
.logo img{width:auto;max-width:220px;max-height:95px;object-fit:contain}
h1{margin:0;text-align:center;font-size:42px;line-height:1.1}
.sub{margin:12px 0 36px;text-align:center;color:#9eafa3;font-size:21px}
.field{margin-bottom:24px}
label{display:block;margin-bottom:9px;font-size:18px;font-weight:700}
input{
  width:100%;height:72px;padding:0 22px;border:1px solid #31503a;border-radius:17px;
  outline:none;background:#08120c;color:#fff;font-size:20px;
}
input:focus{border-color:#b8ff35;box-shadow:0 0 0 3px rgba(184,255,53,.08)}
button{
  width:100%;height:76px;border:0;border-radius:17px;background:#b8ff35;color:#071006;
  font-size:24px;font-weight:800;cursor:pointer;
}
button:disabled{opacity:.6;cursor:not-allowed}
.forgot{display:block;margin:24px 0 0;text-align:center;color:#b8ff35;font-size:19px;text-decoration:none}
.forgot:hover{text-decoration:underline}
.msg{min-height:28px;margin-top:20px;text-align:center;font-size:16px;line-height:1.45}
.back{display:block;margin-top:30px;text-align:center;color:#9eafa3;font-size:18px;text-decoration:none}
.back:hover{color:#fff}
@media(max-width:600px){
  body{padding:14px}.card{padding:30px 22px;border-radius:22px}
  h1{font-size:32px}.sub{font-size:17px;margin-bottom:28px}
  input{height:62px;font-size:17px}button{height:64px;font-size:21px}
}
</style>
</head>
<body>
<main class="card">
  <div class="logo"><img src="Logo.png" alt="AdVisual Studio"></div>
  <h1>Admin Login</h1>
  <p class="sub">Advisual Studio Portfolio</p>

  <form id="loginForm" novalidate>
    <div class="field">
      <label for="email">Admin Email</label>
      <input id="email" type="email" autocomplete="username"
             value="advisualstudiodesign@gmail.com" placeholder="Enter admin Gmail">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password"
             placeholder="Enter password">
    </div>
    <button id="loginBtn" type="submit">Login</button>
  </form>

  <a class="forgot" id="forgotBtn" href="#">Forgot Password?</a>
  <div class="msg" id="msg" aria-live="polite"></div>
  <a class="back" href="index.html">← Back to Portfolio</a>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import {
  getAuth,
  signInWithEmailAndPassword,
  sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyC6LIAjmG6lPTYXZXXc0v2cAmK1jL9xRJw",
  authDomain: "advisual-studio-admin.firebaseapp.com",
  projectId: "advisual-studio-admin",
  storageBucket: "advisual-studio-admin.firebasestorage.app",
  messagingSenderId: "883242532024",
  appId: "1:883242532024:web:896cda30f0401c8ac5884d",
  measurementId: "G-6XH4DTWZJD"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const form = document.getElementById("loginForm");
const email = document.getElementById("email");
const password = document.getElementById("password");
const loginBtn = document.getElementById("loginBtn");
const forgotBtn = document.getElementById("forgotBtn");
const msg = document.getElementById("msg");

function show(text, ok=false){
  msg.textContent = text;
  msg.style.color = ok ? "#b8ff35" : "#ff9b9b";
}

function errorText(code){
  const map = {
    "auth/api-key-not-valid":"Firebase API key valid nahi hai.",
    "auth/invalid-api-key":"Firebase API key invalid hai.",
    "auth/invalid-credential":"Email ya password galat hai.",
    "auth/invalid-email":"Email address sahi format mein nahi hai.",
    "auth/user-not-found":"Admin user Firebase mein nahi mila.",
    "auth/wrong-password":"Password galat hai.",
    "auth/too-many-requests":"Bahut attempts ho gaye. Thodi der baad try karo.",
    "auth/network-request-failed":"Internet/network problem. Dobara try karo.",
    "auth/operation-not-allowed":"Firebase Email/Password sign-in enabled nahi hai.",
    "auth/unauthorized-domain":"Website Firebase Authorized Domains mein add nahi hai."
  };
  return map[code] || ("Firebase error: " + code);
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const mail = email.value.trim();
  const pass = password.value;

  if(!mail){ show("Admin Email enter karo."); email.focus(); return; }
  if(!pass){ show("Password enter karo."); password.focus(); return; }

  loginBtn.disabled = true;
  loginBtn.textContent = "Logging in...";
  show("Login check ho raha hai...", true);

  try{
    await signInWithEmailAndPassword(auth, mail, pass);
    show("Login successful. Dashboard open ho raha hai...", true);
    setTimeout(() => {
      window.location.href = "admin-dashboard.html";
    }, 300);
  }catch(error){
    console.error(error);
    show(errorText(error.code));
    loginBtn.disabled = false;
    loginBtn.textContent = "Login";
  }
});

forgotBtn.addEventListener("click", async (e) => {
  e.preventDefault();
  const mail = email.value.trim();

  if(!mail){ show("Pehle Admin Email enter karo."); email.focus(); return; }

  show("Password reset email bhej rahe hain...", true);

  try{
    await sendPasswordResetEmail(auth, mail);
    show("Password reset link Gmail par bhej diya gaya hai.", true);
  }catch(error){
    console.error(error);
    show(errorText(error.code));
  }
});
</script>
</body>
</html>
